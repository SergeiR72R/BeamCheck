name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test and assemble BeamCheck.bundle
        shell: pwsh
        run: ./deploy/build.ps1
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: BeamCheck-PERICAD
          path: |
            dist/BeamCheck.bundle
            dist/install.ps1
            dist/install.cmd
